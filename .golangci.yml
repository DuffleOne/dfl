version: "2"

linters:
  default: none
  enable:
    - asciicheck
    - containedctx
    - contextcheck
    - errcheck
    - errcheck
    - errname
    - exptostd
    - goconst
    - godox
    - govet
    - importas
    - ineffassign
    - intrange
    - mirror
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - recvcheck
    - revive
    - sloglint
    - staticcheck
    - tagliatelle
    - thelper
    - unconvert
    # - unparam # panics on our generic methods: x/tools go/ssa RuntimeTypes
    #   walks method sets and trips over an uninstantiated type param
    #   (golang/go#80139). Fixed upstream, but golangci-lint v2.12.2 still
    #   vendors x/tools v0.44.0, which predates the fix. Re-enable once a
    #   release picks up a newer x/tools.
    - unused
    - wastedassign
    - whitespace
    # - wrapcheck # would love to enable this one day, but it's too noisy right now
    - wsl_v5
  settings:
    goconst:
      min-occurrences: 5
    godox:
      keywords:
        - NOMERGE
    recvcheck:
      exclusions:
        - "*.Scan"
        - "*.Value"
    revive:
      rules:
        - name: var-naming
    tagliatelle:
      case:
        rules:
          json: snake
          db: snake

formatters:
  enable:
    - goimports
