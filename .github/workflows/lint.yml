name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Matches the "go 1.27rc2" directive in go.mod. Both say the RC
          # explicitly, so nothing tries to fetch the unreleased go1.27.0.
          # Move both to plain 1.27 when it ships.
          go-version: "1.27.0-rc.2"
      - uses: golangci/golangci-lint-action@v7
        with:
          # v2.11.4 can't read Go 1.27 export data, which went to version 4 to
          # carry generic methods. v2.12.2 can.
          version: v2.12.2
