name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Matches the "go 1.27rc2" directive in go.mod. Both say the RC
          # explicitly, so nothing tries to fetch the unreleased go1.27.0.
          # Move both to plain 1.27 when it ships.
          go-version: "1.27.0-rc.2"
      # Built from source rather than via golangci/golangci-lint-action. The
      # action downloads a prebuilt binary, and the released binaries are
      # built with Go 1.26, which refuses to lint a module targeting 1.27:
      # "the Go language version (go1.26) used to build golangci-lint is
      # lower than the targeted Go version (1.27)". Building it with the RC
      # sidesteps that. Go back to the action once they ship a release built
      # with Go 1.27.
      #
      # v2.11.4 also couldn't read Go 1.27 export data (version 4, bumped to
      # carry generic methods), so this is v2.12.2 regardless.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run ./...

      # staticcheck runs separately, not through golangci-lint. The v0.7.0 that
      # golangci-lint v2.12.2 vendors panics building Go 1.27's stdlib
      # ("unexpected expr: *ast.KeyValueExpr" in internal/poll). It only shows
      # up on linux, so it passes locally on a mac and fails here. v0.8.0-rc.1
      # is fine. Drop this step and re-enable staticcheck in .golangci.yml once
      # golangci-lint vendors v0.8 or later.
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1
      - run: staticcheck ./...
