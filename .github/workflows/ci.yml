name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The repo is five Go modules (root, the cher coercer, and the three cloud
# transports), and `./...` only ever covers the module you run it from, so
# the test job loops over the module directories and lint fans out as a matrix.

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: "**/go.sum"
      - name: go test all modules
        run: |
          for dir in . http/cher events/aws events/gcp events/otel; do
            (cd "$dir" && go test -race ./...)
          done

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "http/cher", "events/aws", "events/gcp", "events/otel"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: "**/go.sum"
      # v2.13.1 release binaries are built with Go 1.27 and vendor staticcheck
      # v0.8.0, which retires the RC-era workarounds: the from-source build and
      # the standalone staticcheck step.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: ${{ matrix.module }}
