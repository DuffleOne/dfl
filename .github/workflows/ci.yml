name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The repo is five Go modules (root, the cher coercer, and the three cloud
# transports), and `./...` only ever covers the module you run it from, so
# the test job loops over the module directories and lint fans out as a matrix.

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: "**/go.sum"
      - name: go test all modules
        run: |
          for dir in . http/cher events/aws events/gcp events/otel; do
            (cd "$dir" && go test -race ./...)
          done

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "http/cher", "events/aws", "events/gcp", "events/otel"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: "**/go.sum"
      # Go 1.27.2 writes export data v5. golangci-lint v2.13.x vendors x/tools
      # v0.49.0, which only reads up to v4, so every stdlib import fails
      # typecheck. v2.14.0 vendors x/tools v0.50.0 and reads v5. The Go the
      # binary was built with (1.27.0 for both) isn't what decides it.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
