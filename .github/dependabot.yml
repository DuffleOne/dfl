version: 2
updates:
  # One entry per Go module: dependabot doesn't walk nested go.mods, so the
  # cloud transport modules each need listing or their advisories go unseen.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/events/aws"
      - "/events/gcp"
      - "/events/otel"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
