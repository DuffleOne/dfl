version: "3"

vars:
  # Every Go module in the repo. `./...` only covers the module it runs in,
  # so anything repo-wide loops over these.
  MODULES: ". http/cher events/aws events/gcp events/otel"

tasks:
  test:
    desc: Run go test for every module
    cmds:
      - |
        set -e
        for dir in {{.MODULES}}; do
          (cd "$dir" && go test ./...)
        done

  lint:
    desc: Run golangci-lint for every module
    cmds:
      - |
        set -e
        for dir in {{.MODULES}}; do
          (cd "$dir" && golangci-lint run ./...)
        done
